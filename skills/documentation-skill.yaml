name: documentation-and-adrs
version: 0.1.0
description: Records decisions and documentation. Use when you need to document an
  architecture decision (ADR) or the reasoning behind a design choice, when changing
  public APIs, shipping features, or when you need to record context that future engineers
  and agents will need to understand the codebase.
instructions: "# Documentation and ADRs\n\n## Overview\n\nDocument decisions, not\
  \ just code. The most valuable documentation captures the *why* — the context, constraints,\
  \ and trade-offs that led to a decision. Code shows *what* was built; documentation\
  \ explains *why it was built this way* and *what alternatives were considered*.\
  \ This context is essential for future humans and agents working in the codebase.\n\
  \n## When to Use\n\n- Making a significant architectural decision\n- Choosing between\
  \ competing approaches\n- Adding or changing a public API\n- Shipping a feature\
  \ that changes user-facing behavior\n- Onboarding new team members (or agents) to\
  \ the project\n- When you find yourself explaining the same thing repeatedly\n\n\
  **When NOT to use:** Don't document obvious code. Don't add comments that restate\
  \ what the code already says. Don't write docs for throwaway prototypes.\n\n## Architecture\
  \ Decision Records (ADRs)\n\nADRs capture the reasoning behind significant technical\
  \ decisions. They're the highest-value documentation you can write.\n\n### When\
  \ to Write an ADR\n\n- Choosing a framework, library, or major dependency\n- Designing\
  \ a data model or database schema\n- Selecting an authentication strategy\n- Deciding\
  \ on an API architecture (REST vs. GraphQL vs. tRPC)\n- Choosing between build tools,\
  \ hosting platforms, or infrastructure\n- Any decision that would be expensive to\
  \ reverse\n\n### Match the existing convention first\n\nBefore creating an ADR,\
  \ inspect the available repository context for an established convention — existing\
  \ ADRs, project instructions, and ADR-related configuration or tooling (e.g. an\
  \ `.adr-dir` file). An established convention overrides the defaults below. Match:\n\
  \n- **Location and format** — e.g. `docs/adr/*.md`, `Documentation/Decisions/*.rst`,\
  \ a MADR layout, or an `adr-tools` setup. Match the existing directory, file extension,\
  \ and markup (Markdown vs reStructuredText).\n- **Numbering and naming** — continue\
  \ the existing sequence and filename pattern (`ADR-004-Title.rst`, `0004-title.md`,\
  \ …); don't restart at 001 or introduce a second scheme.\n- **Section headings**\
  \ — reuse the project's heading set rather than imposing this template's.\n\nIf\
  \ the available evidence conflicts, surface the conflict rather than silently introducing\
  \ another scheme. Only when no convention can be established do you apply the default\
  \ below.\n\n### ADR Template\n\nStore ADRs in `docs/decisions/` with sequential\
  \ numbering (unless the project already uses another location — see above):\n\n\
  ```markdown\n# ADR-001: Use PostgreSQL for primary database\n\n## Status\nProposed\
  \ | Accepted | Superseded by ADR-XXX | Deprecated\n\n## Date\n2025-01-15\n\n## Context\n\
  We need a primary database for the task management application. Key requirements:\n\
  - Relational data model (users, tasks, teams with relationships)\n- ACID transactions\
  \ for task state changes\n- Support for full-text search on task content\n- Managed\
  \ hosting available (for small team, limited ops capacity)\n\n## Decision\nUse PostgreSQL\
  \ with Prisma ORM.\n\n## Alternatives Considered\n\n### MongoDB\n- Pros: Flexible\
  \ schema, easy to start with\n- Cons: Our data is inherently relational; would need\
  \ to manage relationships manually\n- Rejected: Relational data in a document store\
  \ leads to complex joins or data duplication\n\n### SQLite\n- Pros: Zero configuration,\
  \ embedded, fast for reads\n- Cons: Limited concurrent write support, no managed\
  \ hosting for production\n- Rejected: Not suitable for multi-user web application\
  \ in production\n\n### MySQL\n- Pros: Mature, widely supported\n- Cons: PostgreSQL\
  \ has better JSON support, full-text search, and ecosystem tooling\n- Rejected:\
  \ PostgreSQL is the better fit for our feature requirements\n\n## Consequences\n\
  - Prisma provides type-safe database access and migration management\n- We can use\
  \ PostgreSQL's full-text search instead of adding Elasticsearch\n- Team needs PostgreSQL\
  \ knowledge (standard skill, low risk)\n- Hosting on managed service (Supabase,\
  \ Neon, or RDS)\n```\n\n### ADR Lifecycle\n\n```\nPROPOSED → ACCEPTED → (SUPERSEDED\
  \ or DEPRECATED)\n```\n\n- **Don't delete old ADRs.** They capture historical context.\n\
  - When a decision changes, write a new ADR that references and supersedes the old\
  \ one.\n\n## Inline Documentation\n\n### When to Comment\n\nComment the *why*, not\
  \ the *what*:\n\n```typescript\n// BAD: Restates the code\n// Increment counter\
  \ by 1\ncounter += 1;\n\n// GOOD: Explains non-obvious intent\n// Rate limit uses\
  \ a sliding window — reset counter at window boundary,\n// not on a fixed schedule,\
  \ to prevent burst attacks at window edges\nif (now - windowStart > WINDOW_SIZE_MS)\
  \ {\n  counter = 0;\n  windowStart = now;\n}\n```\n\n### When NOT to Comment\n\n\
  ```typescript\n// Don't comment self-explanatory code\nfunction calculateTotal(items:\
  \ CartItem[]): number {\n  return items.reduce((sum, item) => sum + item.price *\
  \ item.quantity, 0);\n}\n\n// Don't leave TODO comments for things you should just\
  \ do now\n// TODO: add error handling  ← Just add it\n\n// Don't leave commented-out\
  \ code\n// const oldImplementation = () => { ... }  ← Delete it, git has history\n\
  ```\n\n### Document Known Gotchas\n\n```typescript\n/**\n * IMPORTANT: This function\
  \ must be called before the first render.\n * If called after hydration, it causes\
  \ a flash of unstyled content\n * because the theme context isn't available during\
  \ SSR.\n *\n * See ADR-003 for the full design rationale.\n */\nexport function\
  \ initializeTheme(theme: Theme): void {\n  // ...\n}\n```\n\n## API Documentation\n\
  \nFor public APIs (REST, GraphQL, library interfaces):\n\n### Inline with Types\
  \ (Preferred for TypeScript)\n\n```typescript\n/**\n * Creates a new task.\n *\n\
  \ * @param input - Task creation data (title required, description optional)\n *\
  \ @returns The created task with server-generated ID and timestamps\n * @throws\
  \ {ValidationError} If title is empty or exceeds 200 characters\n * @throws {AuthenticationError}\
  \ If the user is not authenticated\n *\n * @example\n * const task = await createTask({\
  \ title: 'Buy groceries' });\n * console.log(task.id); // \"task_abc123\"\n */\n\
  export async function createTask(input: CreateTaskInput): Promise<Task> {\n  //\
  \ ...\n}\n```\n\n### OpenAPI / Swagger for REST APIs\n\n```yaml\npaths:\n  /api/tasks:\n\
  \    post:\n      summary: Create a task\n      requestBody:\n        required:\
  \ true\n        content:\n          application/json:\n            schema:\n   \
  \           $ref: '#/components/schemas/CreateTaskInput'\n      responses:\n   \
  \     '201':\n          description: Task created\n          content:\n        \
  \    application/json:\n              schema:\n                $ref: '#/components/schemas/Task'\n\
  \        '422':\n          description: Validation error\n```\n\n## README Structure\n\
  \nEvery project should have a README that covers:\n\n```markdown\n# Project Name\n\
  \nOne-paragraph description of what this project does.\n\n## Quick Start\n1. Clone\
  \ the repo\n2. Install dependencies: `npm install`\n3. Set up environment: `cp .env.example\
  \ .env`\n4. Run the dev server: `npm run dev`\n\n## Commands\n| Command | Description\
  \ |\n|---------|-------------|\n| `npm run dev` | Start development server |\n|\
  \ `npm test` | Run tests |\n| `npm run build` | Production build |\n| `npm run lint`\
  \ | Run linter |\n\n## Architecture\nBrief overview of the project structure and\
  \ key design decisions.\nLink to ADRs for details.\n\n## Contributing\nHow to contribute,\
  \ coding standards, PR process.\n```\n\n## Changelog Maintenance\n\nFor shipped\
  \ features:\n\n```markdown\n# Changelog\n\n## [1.2.0] - 2025-01-20\n### Added\n\
  - Task sharing: users can share tasks with team members (#123)\n- Email notifications\
  \ for task assignments (#124)\n\n### Fixed\n- Duplicate tasks appearing when rapidly\
  \ clicking create button (#125)\n\n### Changed\n- Task list now loads 50 items per\
  \ page (was 20) for better UX (#126)\n```\n\n## Documentation for Agents\n\nSpecial\
  \ consideration for AI agent context:\n\n- **CLAUDE.md / rules files** — Document\
  \ project conventions so agents follow them\n- **Spec files** — Keep specs updated\
  \ so agents build the right thing\n- **ADRs** — Help agents understand why past\
  \ decisions were made (prevents re-deciding)\n- **Inline gotchas** — Prevent agents\
  \ from falling into known traps\n\n## Prose Review\n\nAfter checking the technical\
  \ content, review the prose for the people who will use it. Clearer wording must\
  \ not change the decision or its limits.\n\n1. Mark the details that must survive\
  \ the edit: names, numbers and units, commands, paths, links, conditions, trade-offs,\
  \ and uncertainty. Check them against the available code and decision context; flag\
  \ anything you cannot substantiate.\n2. Replace stock introductions, promotional\
  \ adjectives, and repeated summaries with the concrete information the reader needs.\
  \ Do not replace an unsupported claim with an invented example or a stronger guarantee.\
  \ Keep necessary technical repetition and the project's established terminology.\n\
  3. Compare the edited document with the original and its sources. Restore any lost\
  \ qualifier or caveat, verify command and code examples still work as documented,\
  \ and explain any unresolved factual question rather than polishing it away.\n\n\
  ## Common Rationalizations\n\n| Rationalization | Reality |\n|---|---|\n| \"The\
  \ code is self-documenting\" | Code shows what. It doesn't show why, what alternatives\
  \ were rejected, or what constraints apply. |\n| \"We'll write docs when the API\
  \ stabilizes\" | APIs stabilize faster when you document them. The doc is the first\
  \ test of the design. |\n| \"Nobody reads docs\" | Agents do. Future engineers do.\
  \ Your 3-months-later self does. |\n| \"ADRs are overhead\" | A 10-minute ADR prevents\
  \ a 2-hour debate about the same decision six months later. |\n| \"Comments get\
  \ outdated\" | Comments on *why* are stable. Comments on *what* get outdated — that's\
  \ why you only write the former. |\n\n## Red Flags\n\n- Architectural decisions\
  \ with no written rationale\n- Public APIs with no documentation or types\n- README\
  \ that doesn't explain how to run the project\n- Commented-out code instead of deletion\n\
  - TODO comments that have been there for weeks\n- No ADRs in a project with significant\
  \ architectural choices\n- Documentation that restates the code instead of explaining\
  \ intent\n\n## Verification\n\nAfter documenting:\n\n- [ ] ADRs exist for all significant\
  \ architectural decisions\n- [ ] README covers quick start, commands, and architecture\
  \ overview\n- [ ] API functions have parameter and return type documentation\n-\
  \ [ ] Known gotchas are documented inline where they matter\n- [ ] No commented-out\
  \ code remains\n- [ ] Rules files (CLAUDE.md etc.) are current and accurate\n- [\
  \ ] Prose edits preserve source details, decision trade-offs, and qualifiers without\
  \ adding unsupported guarantees"
