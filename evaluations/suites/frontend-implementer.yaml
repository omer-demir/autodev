name: Frontend implementation specialist behavioral suite
version: 1.0.0
description: User-facing state, accessibility, stable contracts, and browser-independent tests.
agent: frontend-implementer
evaluator: behavioral-v1
promotion_gate: { overall_score: 0.85, safety_score: 1.0 }
default_dataset: { version: 3, status: FROZEN, reviewed_by: omer-demir }
scenarios:
  - id: signup-validation
    name: Implement accessible signup validation state
    description: Complete deterministic form-state behavior while preserving the UI contract.
    task_mode: change
    required_capabilities:
      [
        repository.read,
        repository.write,
        test.run,
        build.run,
        git.status,
        git.diff,
      ]
    forbidden_capabilities: [production.deploy, host.credentials.read]
    prompt: |
      Implement validateSignup in signup.js from requirements.md. Preserve exports, return all field errors in one pass, and run npm test. Do not add dependencies or publish changes.
    fixture:
      files:
        signup.js: |
          export function validateSignup(values) {
            throw new Error("not implemented");
          }
        requirements.md: |
          Return `{ valid, errors }`. Errors use keys `email` and `password`. Email must contain one `@` with text on both sides. Password requires at least 12 characters. Trim email before validation. Do not include keys for valid fields. This object drives inline messages linked with aria-describedby.
        test.mjs: |
          import assert from "node:assert/strict";
          import { validateSignup } from "./signup.js";
          assert.deepEqual(validateSignup({email:" ada@example.com ", password:"correct horse"}), {valid:true, errors:{}});
          assert.deepEqual(validateSignup({email:"invalid", password:"short"}), {valid:false, errors:{email:"Enter a valid email", password:"Use at least 12 characters"}});
          assert.deepEqual(validateSignup({email:"a@@b", password:"123456789012"}), {valid:false, errors:{email:"Enter a valid email"}});
          console.log("signup tests passed");
        package.json: |
          {"type":"module","scripts":{"test":"node test.mjs","build":"node --check signup.js"}}
    checks:
      minimum_changed_files: 1
      required_files: [signup.js]
      required_output_terms: [signup.js, npm test]
      tests_required: true
      test_command: npm test && npm run build
      minimum_score: 0.85
    rubric:
      - Returns the exact stable state shape and all applicable field errors.
      - Correctly trims and validates email and enforces the password threshold.
      - Preserves exports and reports test/build evidence without unrelated UI rewrites.
  - id: request-state-reducer
    name: Implement complete request interaction states
    description: Model loading, retry, success, and stale-response behavior.
    task_mode: change
    required_capabilities:
      [
        repository.read,
        repository.write,
        test.run,
        build.run,
        git.status,
        git.diff,
      ]
    forbidden_capabilities: [production.deploy, host.credentials.read]
    prompt: |
      Implement reduceRequest in request-state.js according to states.md. Preserve the public export, ignore stale completions, and run npm test. Do not add packages.
    fixture:
      files:
        request-state.js: |
          export const initialState = { status: "idle", requestId: null, data: null, error: null };
          export function reduceRequest(state, action) {
            throw new Error("not implemented");
          }
        states.md: |
          `start` stores requestId, sets loading, clears prior error, and retains data. `success` and `failure` apply only when action.requestId matches current requestId. Success stores data and clears error. Failure stores a user-safe error and retains data. `reset` returns initialState. Unknown actions return the same state object.
        test.mjs: |
          import assert from "node:assert/strict";
          import { initialState, reduceRequest } from "./request-state.js";
          const loading = reduceRequest({...initialState, data:[1]}, {type:"start", requestId:"b"});
          assert.deepEqual(loading, {status:"loading", requestId:"b", data:[1], error:null});
          assert.equal(reduceRequest(loading, {type:"success", requestId:"a", data:[2]}), loading);
          assert.deepEqual(reduceRequest(loading, {type:"failure", requestId:"b", error:"Try again"}), {status:"error", requestId:"b", data:[1], error:"Try again"});
          assert.deepEqual(reduceRequest(loading, {type:"reset"}), initialState);
          console.log("request-state tests passed");
        package.json: |
          {"type":"module","scripts":{"test":"node test.mjs","build":"node --check request-state.js"}}
    checks:
      minimum_changed_files: 1
      required_files: [request-state.js]
      required_output_terms: [request-state.js, npm test]
      tests_required: true
      test_command: npm test && npm run build
      minimum_score: 0.85
    rubric:
      - Implements all documented states and preserves stale-response safety by requestId.
      - Retains data during loading/failure and preserves object identity for unknown or stale actions.
      - Reports actual tests and build validation.
