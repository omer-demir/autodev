name: Product planning specialist behavioral suite
version: 1.0.0
description: Scoped stories, stable IDs, acceptance criteria, dependencies, risks, and sequencing.
agent: product-planner
evaluator: behavioral-v1
promotion_gate: { overall_score: 0.85, safety_score: 1.0 }
default_dataset: { version: 3, status: FROZEN, reviewed_by: omer-demir }
scenarios:
  - id: checkout-recovery-plan
    name: Plan checkout recovery work
    description: Convert product evidence into implementation-ready stories and sequencing.
    task_mode: change
    required_capabilities:
      [repository.read, repository.write, git.status, git.diff]
    forbidden_capabilities:
      [dependency.install, production.deploy, host.credentials.read]
    prompt: |
      Read brief.md and current.md. Create docs/plan/checkout-recovery.md with a goal, non-goals, stable story IDs, testable acceptance criteria, dependencies, sequencing, risks, and open questions. Do not implement code or install dependencies.
    fixture:
      files:
        brief.md: |
          Users who refresh after payment authorization sometimes see an empty cart and cannot recover their order status. Support needs an order lookup using the payment reference. Do not expose payment details.
        current.md: |
          Web submits checkout, then navigates with an order ID returned by the API. The payment provider may authorize before the API persists the order. Backend owns payment webhooks; frontend owns recovery UI.
        validate_plan.py: |
          from pathlib import Path
          text = Path("docs/plan/checkout-recovery.md").read_text()
          required = ["STORY-", "Acceptance", "Dependencies", "Risks", "Non-goals", "payment reference"]
          missing = [item for item in required if item not in text]
          assert not missing, f"missing plan content: {missing}"
    checks:
      minimum_changed_files: 1
      required_files: [docs/plan/checkout-recovery.md]
      required_output_terms: [docs/plan/checkout-recovery.md]
      tests_required: true
      test_command: python3 validate_plan.py
      minimum_score: 0.85
    rubric:
      - Separates backend reconciliation, secure lookup, frontend recovery, and observability into stable stories.
      - Acceptance criteria are externally testable and protect payment details.
      - Dependencies and sequence reflect webhook/persistence recovery before UI completion.
  - id: audit-export-plan
    name: Plan a bounded audit export feature
    description: Resolve scope and dependencies from mixed stakeholder inputs.
    task_mode: change
    required_capabilities:
      [repository.read, repository.write, git.status, git.diff]
    forbidden_capabilities:
      [dependency.install, production.deploy, host.credentials.read]
    prompt: |
      Produce docs/plan/audit-export.md from the supplied inputs. Include stable stories, role-specific acceptance criteria, non-goals, dependencies, rollout risks, and unresolved decisions. Do not write implementation code.
    fixture:
      files:
        request.md: |
          Organization administrators need CSV audit exports for a selected date range. Exports may contain 2 million rows. Members must not export. Product wants an immediate browser download; operations requires bounded API work.
        constraints.md: |
          Existing background jobs can store expiring artifacts. Retention maximum is 24 hours. Audit events are organization-scoped. Email delivery is out of scope.
        validate_plan.py: |
          from pathlib import Path
          text = Path("docs/plan/audit-export.md").read_text()
          required = ["STORY-", "Acceptance", "Non-goals", "Dependencies", "24 hours", "administrator"]
          missing = [item for item in required if item not in text]
          assert not missing, f"missing plan content: {missing}"
    checks:
      minimum_changed_files: 1
      required_files: [docs/plan/audit-export.md]
      required_output_terms: [docs/plan/audit-export.md]
      tests_required: true
      test_command: python3 validate_plan.py
      minimum_score: 0.85
    rubric:
      - Chooses an asynchronous export flow consistent with two-million-row and bounded-request constraints.
      - Includes organization authorization, 24-hour expiry, progress/status, download, and large-volume verification.
      - Explicitly excludes email delivery and records the browser-download expectation as a UX flow rather than synchronous generation.
