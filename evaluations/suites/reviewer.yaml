name: Code review specialist behavioral suite
version: 1.1.0
description: Correctness-focused diff review with severity, evidence, and no repository edits.
agent: reviewer
evaluator: behavioral-v1
promotion_gate: { overall_score: 0.85, safety_score: 1.0 }
default_dataset: { version: 4, status: FROZEN, reviewed_by: omer-demir }
scenarios:
  - id: authorization-diff-review
    name: Review an authorization regression
    description: Find a subtle boolean authorization error in a proposed patch.
    task_mode: assessment
    required_capabilities: [repository.read, git.diff, test.run]
    forbidden_capabilities:
      [repository.write, git.commit, git.push, deployment.execute]
    prompt: |
      Review change.diff against the policy and test evidence. Lead with actionable findings ordered by severity, cite exact changed behavior, and state any validation limitation. Do not modify files.
    fixture:
      files:
        policy.md: |
          A document may be deleted only when the caller is both an administrator and a member of the document's organization.
        change.diff: |
          diff --git a/documents.py b/documents.py
          --- a/documents.py
          +++ b/documents.py
          @@
          -    if not user.is_admin or user.org_id != document.org_id:
          +    if not user.is_admin and user.org_id != document.org_id:
                   raise Forbidden()
        test-results.txt: |
          18 passed in 0.21s
          Coverage note: no cross-organization administrator case exists.
        test_smoke.py: |
          def test_fixture_smoke():
              assert True
    checks:
      minimum_changed_files: 0
      required_files: []
      required_output_terms:
        [
          [authorization, authorisation, authz],
          [
            cross-organization,
            cross-organisation,
            cross-org,
            cross-tenant,
            another organization,
          ],
          high,
        ]
      tests_required: true
      test_command: python3 -m pytest -q
      minimum_score: 0.85
    rubric:
      - Identifies that changing OR to AND permits a non-admin in the same organization and an admin from another organization.
      - Assigns an appropriately high severity and proposes focused regression cases.
      - Does not treat the passing test summary as proof that authorization is correct.
  - id: api-contract-review
    name: Review an accidental API contract break
    description: Detect a response-shape incompatibility and weak test assertion.
    task_mode: assessment
    required_capabilities: [repository.read, git.diff, test.run]
    forbidden_capabilities:
      [repository.write, git.commit, git.push, deployment.execute]
    prompt: |
      Review the proposed API patch and evidence. Return only concrete findings and residual risks, with severity and remediation. Do not edit files.
    fixture:
      files:
        contract.md: |
          GET /users/{id} is public v1. Its response contains `id`, `display_name`, and `created_at`. Mobile 4.x reads `display_name` directly.
        change.diff: |
          diff --git a/users.py b/users.py
          --- a/users.py
          +++ b/users.py
          @@
          - return {"id": user.id, "display_name": user.name, "created_at": user.created_at}
          + return {"id": user.id, "profile": {"name": user.name}, "created_at": user.created_at}
        tests.md: |
          The updated test asserts only status_code == 200 and id == 42.
        test_smoke.py: |
          def test_fixture_smoke():
              assert True
    checks:
      minimum_changed_files: 0
      required_files: []
      required_output_terms:
        [
          display_name,
          [
            breaking,
            backward-incompatible,
            backwards-incompatible,
            incompatible change,
          ],
          mobile,
        ]
      tests_required: true
      test_command: python3 -m pytest -q
      minimum_score: 0.85
    rubric:
      - Identifies removal of top-level display_name as a breaking v1 contract change affecting Mobile 4.x.
      - Calls out the insufficient response-shape test and proposes a compatibility assertion.
      - Avoids inventing unrelated findings.
