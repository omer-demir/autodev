[project]
name = "agentic-sdlc-workbench"
version = "0.1.0"
description = "Local-first, governed agentic SDLC workbench"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlmodel>=0.0.24,<1",
    "sqlalchemy>=2.0.14,<2.1",
    "pydantic-settings>=2.8,<3",
    "typer>=0.15,<1",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
    "redis>=6.4,<7",
    "azure-identity>=1.25,<2",
    "azure-storage-blob>=12.27,<13",
    "azure-keyvault-secrets>=4.10,<5",
    "pyjwt[crypto]>=2.10,<3",
    "pyyaml>=6.0,<7",
    "jinja2>=3.1,<4",
    "mcp>=1.12,<2",
    "agent-framework-github-copilot==2.0.1",
    "agent-framework-ollama==1.0.0b261002",
    "agent-governance-toolkit-core==5.0.0",
    "agent-governance-toolkit-compliance==5.0.0",
    "agent-sre==3.7.0",
    "opentelemetry-sdk>=1.38,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.38,<2",
    "opentelemetry-instrumentation-fastapi>=0.59b0,<1",
    "opentelemetry-instrumentation-httpx>=0.59b0,<1",
    "opentelemetry-instrumentation-redis>=0.59b0,<1",
    "opentelemetry-instrumentation-sqlalchemy>=0.59b0,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.11,<1"]

[project.scripts]
agentctl = "agentctl.main:app"

[tool.pytest.ini_options]
pythonpath = ["apps/api", "cli"]
testpaths = ["apps/api/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008", "BLE001", "I001"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/app", "cli/agentctl"]
